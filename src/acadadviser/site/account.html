<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account | AcadAdviserAI</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/auth.js" defer></script>
</head>
<body data-auth-page="account">
<div class="shell">
  {{SIDEBAR}}
  <div class="content">
    <main class="stack auth-page">
      <section class="panel auth-card" id="account-loading" aria-live="polite">
        <h1>Your account</h1>
        <p>One moment…</p>
        <noscript><p class="form-error">Sign-in needs JavaScript. Please turn it on and reload this page.</p></noscript>
      </section>
      <section class="panel auth-card" id="account-ready" hidden>
        <h1>You are signed in</h1>
        <p>Signed in as <strong id="account-email"></strong></p>
        <p class="account-note"><strong>Program lists are opening soon.</strong> We are finishing this part of AcadAdviserAI, so you cannot start a list yet.</p>
        <button class="button quiet" id="sign-out" type="button">Sign out</button>
      </section>
    </main>
    {{FOOTER}}
  </div>
</div>
</body>
</html>
